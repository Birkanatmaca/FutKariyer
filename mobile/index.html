<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" />
    <title>Fut Career</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--fut-bg);
      }
      #root {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 480px;
        height: 100%;
        height: 100dvh;
        margin: 0 auto;
        box-sizing: border-box;
        border-inline: 1px solid var(--fut-border);
      }
      #root > div {
        display: flex;
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/main.js"></script>
  </body>
</html>
