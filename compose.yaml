name: futcareer

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: futcareer
      POSTGRES_PASSWORD: futcareer_local
      POSTGRES_DB: futcareer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futcareer -d futcareer"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
